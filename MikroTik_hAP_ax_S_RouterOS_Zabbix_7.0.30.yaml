zabbix_export:
  version: '7.0'
  template_groups:
  - uuid: 36bff6c29af64692839d077febfc7079
    name: Templates/Network devices
  templates:
  - uuid: 76ac4fef612f4b3db0117b9b3eceba39
    template: MikroTik hAP ax S by SNMP
    name: MikroTik hAP ax S by SNMP
    description: 'Model profile: MikroTik hAP ax S. Software family: RouterOS. Zabbix 7.0.30 standalone SNMP monitoring
      template. Generic MIBs only: SNMPv2-MIB, IF-MIB, HOST-RESOURCES-MIB. NOT hardware validated: radio signal, LTE
      signal, model-specific temperatures, PoE power, optical light metrics are omitted to prevent unsupported OID polling.
      Choose only the matching OS template for each host. Catalog: https://mikrotik.com/products/group/indoor-wireless.
      SNMP agent must be configured and reachable.'
    groups:
    - name: Templates/Network devices
    items:
    - uuid: 7d82768545d7401a91b4996342cc5bba
      name: ICMP ping
      type: SIMPLE
      key: icmpping
      delay: 1m
      history: 7d
      tags:
      - tag: component
        value: availability
      triggers:
      - uuid: 7ae5e5982d0f4394b6a1ffdd772a9265
        expression: max(/MikroTik hAP ax S by SNMP/icmpping,#3)=0
        name: 'MikroTik {model}: ICMP unavailable'
        priority: HIGH
        description: 3 consecutive checks failed.
    - uuid: 22a2999af75c441bbd94f1ff7f688a95
      name: ICMP packet loss
      type: SIMPLE
      key: icmppingloss
      delay: 1m
      value_type: FLOAT
      units: '%'
      triggers:
      - uuid: 472287ab097d4a27af0b3dd4dc4e8f17
        expression: min(/MikroTik hAP ax S by SNMP/icmppingloss,5m)>{$MTK.ICMP.LOSS.WARN} and min(/MikroTik hAP ax S
          by SNMP/icmppingloss,5m)<100
        name: 'MikroTik {model}: High ICMP loss'
        priority: WARNING
    - uuid: d4a42ea749234f8f998e6d2b7cefa28e
      name: ICMP round-trip time
      type: SIMPLE
      key: icmppingsec
      delay: 1m
      value_type: FLOAT
      units: s
      triggers:
      - uuid: d698ff60be1f45f5be465a0ac9ea8cbb
        expression: avg(/MikroTik hAP ax S by SNMP/icmppingsec,5m)>{$MTK.ICMP.RTT.WARN}
        name: 'MikroTik {model}: High ICMP RTT'
        priority: WARNING
    - uuid: e6261d37a50f4902898430b48ade187c
      name: SNMP agent uptime
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.2.1.1.3.0]
      key: mtk.sys.uptime
      delay: 1m
      units: uptime
      description: sysUpTime is SNMP agent uptime (seconds); may reset independently of hardware.
      preprocessing:
      - type: MULTIPLIER
        parameters:
        - '0.01'
      tags:
      - tag: component
        value: system
      triggers:
      - uuid: c20d2bb8e9d14532a8230be4d5a5e154
        expression: nodata(/MikroTik hAP ax S by SNMP/mtk.sys.uptime,{$MTK.SNMP.NODATA})=1 and last(/MikroTik hAP ax
          S by SNMP/icmpping)=1
        name: 'MikroTik hAP ax S: SNMP unavailable while ICMP succeeds'
        priority: AVERAGE
    - uuid: 2a67222c195d415c919fc285452ce1ab
      name: System description
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.2.1.1.1.0]
      key: mtk.sys.descr
      delay: 1h
      value_type: CHAR
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 12h
      tags:
      - tag: component
        value: inventory
    - uuid: 7180aa7294574d53a5095813965ed148
      name: System object ID
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.2.1.1.2.0]
      key: mtk.sys.objectid
      delay: 1h
      value_type: CHAR
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 12h
      tags:
      - tag: component
        value: inventory
    - uuid: 17b97019225845d5874f0a783064b694
      name: System name
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.2.1.1.5.0]
      key: mtk.sys.name
      delay: 1h
      value_type: CHAR
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 12h
      tags:
      - tag: component
        value: inventory
    - uuid: a3e30c9aee89487296c61f1e3a49998d
      name: System location
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.2.1.1.6.0]
      key: mtk.sys.location
      delay: 1h
      value_type: CHAR
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 12h
      tags:
      - tag: component
        value: inventory
    - uuid: d8133cecf2604aeaafffc2912702673e
      name: System contact
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.2.1.1.4.0]
      key: mtk.sys.contact
      delay: 1h
      value_type: CHAR
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 12h
      tags:
      - tag: component
        value: inventory
    discovery_rules:
    - uuid: ccc097b8f4094fbf8d1d9ac81d3dcfb6
      name: IF-MIB network interface discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#IFNAME},1.3.6.1.2.1.2.2.1.2]
      key: mtk.if.discovery
      delay: 1h
      filter:
        conditions:
        - macro: '{#IFNAME}'
          value: '{$MTK.IF.MATCHES}'
      item_prototypes:
      - uuid: 0908e945cd064f72889a7406ea47679d
        name: 'Interface {#IFNAME}: Operational status'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.2.2.1.8.{#SNMPINDEX}]
        key: mtk.if.oper[{#SNMPINDEX}]
        delay: 2m
        valuemap:
          name: IF-MIB ifOperStatus
        tags:
        - tag: component
          value: interface
      - uuid: baa5b09335a94f53b225f7b0b08fbd23
        name: 'Interface {#IFNAME}: Administrative status'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.2.2.1.7.{#SNMPINDEX}]
        key: mtk.if.admin[{#SNMPINDEX}]
        delay: 5m
        valuemap:
          name: IF-MIB ifAdminStatus
        tags:
        - tag: component
          value: interface
      - uuid: ce46221b59f14921989377a51f4a88c5
        name: 'Interface {#IFNAME}: IN traffic, 64-bit'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.31.1.1.1.6.{#SNMPINDEX}]
        key: mtk.if.hc.in[{#SNMPINDEX}]
        delay: 1m
        units: bps
        description: Uses IF-MIB 64-bit counters. Older RouterOS may lack these counters.
        preprocessing:
        - type: CHANGE_PER_SECOND
        - type: MULTIPLIER
          parameters:
          - '8'
        tags:
        - tag: component
          value: interface
      - uuid: 8b6c4b0bf6234916a75d88b2d00a3bff
        name: 'Interface {#IFNAME}: OUT traffic, 64-bit'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.31.1.1.1.10.{#SNMPINDEX}]
        key: mtk.if.hc.out[{#SNMPINDEX}]
        delay: 1m
        units: bps
        description: Uses IF-MIB 64-bit counters. Older RouterOS may lack these counters.
        preprocessing:
        - type: CHANGE_PER_SECOND
        - type: MULTIPLIER
          parameters:
          - '8'
        tags:
        - tag: component
          value: interface
      - uuid: d75fe9bbd80f4214a992aa47ac541848
        name: 'Interface {#IFNAME}: IN traffic, 32-bit'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.2.2.1.10.{#SNMPINDEX}]
        key: mtk.if.legacy.in[{#SNMPINDEX}]
        delay: 1m
        units: bps
        description: 32-bit counter fallback; may wrap at high line rates.
        preprocessing:
        - type: CHANGE_PER_SECOND
        - type: MULTIPLIER
          parameters:
          - '8'
        tags:
        - tag: component
          value: interface
      - uuid: fe5ca41c0637403fb4ca326b5e43e149
        name: 'Interface {#IFNAME}: OUT traffic, 32-bit'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.2.2.1.16.{#SNMPINDEX}]
        key: mtk.if.legacy.out[{#SNMPINDEX}]
        delay: 1m
        units: bps
        description: 32-bit counter fallback; may wrap at high line rates.
        preprocessing:
        - type: CHANGE_PER_SECOND
        - type: MULTIPLIER
          parameters:
          - '8'
        tags:
        - tag: component
          value: interface
      - uuid: 6db44a2cf5614c208bd1d39c206d4186
        name: 'Interface {#IFNAME}: Inbound errors'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.2.2.1.14.{#SNMPINDEX}]
        key: mtk.if.in.errors[{#SNMPINDEX}]
        delay: 2m
        units: pps
        preprocessing:
        - type: CHANGE_PER_SECOND
        tags:
        - tag: component
          value: interface
      - uuid: bedfbcfb7197444a8ca73f16c4c1a221
        name: 'Interface {#IFNAME}: Outbound errors'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.2.2.1.20.{#SNMPINDEX}]
        key: mtk.if.out.errors[{#SNMPINDEX}]
        delay: 2m
        units: pps
        preprocessing:
        - type: CHANGE_PER_SECOND
        tags:
        - tag: component
          value: interface
      - uuid: 7cae29b22d59448989beeaea345c04e5
        name: 'Interface {#IFNAME}: Inbound discards'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.2.2.1.13.{#SNMPINDEX}]
        key: mtk.if.in.discards[{#SNMPINDEX}]
        delay: 2m
        units: pps
        preprocessing:
        - type: CHANGE_PER_SECOND
        tags:
        - tag: component
          value: interface
      - uuid: 07eb2f926c794323acb56fe15435bca9
        name: 'Interface {#IFNAME}: Outbound discards'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.2.2.1.19.{#SNMPINDEX}]
        key: mtk.if.out.discards[{#SNMPINDEX}]
        delay: 2m
        units: pps
        preprocessing:
        - type: CHANGE_PER_SECOND
        tags:
        - tag: component
          value: interface
      graph_prototypes:
      - uuid: e53c579a9ff9453e90e8df3ec26392eb
        name: 'Interface {#IFNAME}: Traffic (64-bit)'
        graph_items:
        - color: 1A7AD0
          item:
            host: MikroTik hAP ax S by SNMP
            key: mtk.if.hc.in[{#SNMPINDEX}]
        - sortorder: '1'
          color: ED682B
          item:
            host: MikroTik hAP ax S by SNMP
            key: mtk.if.hc.out[{#SNMPINDEX}]
      - uuid: f3f639a73ef44a25a13a9bb8e0514d0b
        name: 'Interface {#IFNAME}: Errors & Discards'
        graph_items:
        - color: CC0000
          item:
            host: MikroTik hAP ax S by SNMP
            key: mtk.if.in.errors[{#SNMPINDEX}]
        - sortorder: '1'
          color: D4A00C
          item:
            host: MikroTik hAP ax S by SNMP
            key: mtk.if.out.errors[{#SNMPINDEX}]
        - sortorder: '2'
          color: 5B8D2F
          item:
            host: MikroTik hAP ax S by SNMP
            key: mtk.if.in.discards[{#SNMPINDEX}]
        - sortorder: '3'
          color: 7656A5
          item:
            host: MikroTik hAP ax S by SNMP
            key: mtk.if.out.discards[{#SNMPINDEX}]
      trigger_prototypes:
      - uuid: f2205f08b750452da1313b7039d34454
        expression: last(/MikroTik hAP ax S by SNMP/mtk.if.oper[{#SNMPINDEX}])=2 and last(/MikroTik hAP ax S by SNMP/mtk.if.admin[{#SNMPINDEX}])=1
        name: 'MikroTik {#IFNAME}: Admin enabled, interface down'
        priority: WARNING
        description: All discovered interfaces are included by default; adjust {$MTK.IF.MATCHES} to suppress intentionally
          disconnected ports.
    - uuid: a95c74d193444d5480be00ccef00bee8
      name: CPU processor discovery (HOST-RESOURCES-MIB)
      type: SNMP_AGENT
      snmp_oid: discovery[{#CPULOAD},1.3.6.1.2.1.25.3.3.1.2]
      key: mtk.cpu.discovery
      delay: 1h
      description: Discovers CPU processor rows exposed by HOST-RESOURCES-MIB; may be unsupported by some RouterOS builds.
      item_prototypes:
      - uuid: 172b50e3ad4e41c9ac7df9b46aca63a0
        name: 'CPU {#SNMPINDEX}: Utilization'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.25.3.3.1.2.{#SNMPINDEX}]
        key: mtk.cpu.load[{#SNMPINDEX}]
        delay: 2m
        units: '%'
        tags:
        - tag: component
          value: cpu
      graph_prototypes:
      - uuid: 6c6bebd35b904a0583cfda9a91bc5475
        name: 'CPU {#SNMPINDEX}: Load'
        graph_items:
        - color: 1A7AD0
          item:
            host: MikroTik hAP ax S by SNMP
            key: mtk.cpu.load[{#SNMPINDEX}]
      trigger_prototypes:
      - uuid: 3e8f21e3fa924f5ab0f8996ec36080e1
        expression: min(/MikroTik hAP ax S by SNMP/mtk.cpu.load[{#SNMPINDEX}],10m)>90
        name: 'MikroTik CPU {#SNMPINDEX}: Sustained load over 90%'
        priority: WARNING
    macros:
    - macro: '{$MTK.IF.MATCHES}'
      value: .*
      description: Regex for interface descriptions discovered via IF-MIB
    - macro: '{$MTK.ICMP.LOSS.WARN}'
      value: '20'
      description: ICMP packet loss warning, percent
    - macro: '{$MTK.ICMP.RTT.WARN}'
      value: '0.15'
      description: Average ICMP RTT warning, seconds
    - macro: '{$MTK.SNMP.NODATA}'
      value: 15m
      description: SNMP poll no-data alert interval
    tags:
    - tag: class
      value: router/network
    - tag: manufacturer
      value: MikroTik
    valuemaps:
    - uuid: 8dd0b52021754c428d4d0056d5c5be7a
      name: IF-MIB ifOperStatus
      mappings:
      - value: '1'
        newvalue: up
      - value: '2'
        newvalue: down
      - value: '3'
        newvalue: testing
      - value: '4'
        newvalue: unknown
      - value: '5'
        newvalue: dormant
      - value: '6'
        newvalue: notPresent
      - value: '7'
        newvalue: lowerLayerDown
    - uuid: cb659d2d7ca943889981eabb39a61dbf
      name: IF-MIB ifAdminStatus
      mappings:
      - value: '1'
        newvalue: up
      - value: '2'
        newvalue: down
      - value: '3'
        newvalue: testing
  graphs:
  - uuid: 2916c05a100f4a68bc25003ca1766074
    name: MikroTik ICMP response and loss (hAP ax S)
    graph_items:
    - color: 1A7AD0
      item:
        host: MikroTik hAP ax S by SNMP
        key: icmppingsec
    - sortorder: '1'
      color: C98921
      yaxisside: RIGHT
      item:
        host: MikroTik hAP ax S by SNMP
        key: icmppingloss
