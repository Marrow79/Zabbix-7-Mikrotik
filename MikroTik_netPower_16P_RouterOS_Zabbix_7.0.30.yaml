zabbix_export:
  version: '7.0'
  template_groups:
  - uuid: 36bff6c29af64692839d077febfc7079
    name: Templates/Network devices
  templates:
  - uuid: af86022aaa71498a8bf24d0d51d6c962
    template: MikroTik netPower 16P by SNMP RouterOS
    name: MikroTik netPower 16P by SNMP (RouterOS)
    description: 'Model profile: MikroTik netPower 16P. Software family: RouterOS. Zabbix 7.0.30 standalone SNMP monitoring
      template. Generic MIBs only: SNMPv2-MIB, IF-MIB, HOST-RESOURCES-MIB. NOT hardware validated: radio signal, LTE
      signal, model-specific temperatures, PoE power, optical light metrics are omitted to prevent unsupported OID polling.
      Choose only the matching OS template for each host. Catalog: https://mikrotik.com/products/group/switches. SNMP
      agent must be configured and reachable.'
    groups:
    - name: Templates/Network devices
    items:
    - uuid: 06efb677e8ea426cabdf8aa504b6e840
      name: ICMP ping
      type: SIMPLE
      key: icmpping
      delay: 1m
      history: 7d
      tags:
      - tag: component
        value: availability
      triggers:
      - uuid: a5b811d100334168a729eca1c73263ff
        expression: max(/MikroTik netPower 16P by SNMP RouterOS/icmpping,#3)=0
        name: 'MikroTik {model}: ICMP unavailable'
        priority: HIGH
        description: 3 consecutive checks failed.
    - uuid: 5a4fe3f5a90048638aceae9b1ef4c09e
      name: ICMP packet loss
      type: SIMPLE
      key: icmppingloss
      delay: 1m
      value_type: FLOAT
      units: '%'
      triggers:
      - uuid: 48b453af02f04b378e6c48a0aa094a5a
        expression: min(/MikroTik netPower 16P by SNMP RouterOS/icmppingloss,5m)>{$MTK.ICMP.LOSS.WARN} and min(/MikroTik
          netPower 16P by SNMP RouterOS/icmppingloss,5m)<100
        name: 'MikroTik {model}: High ICMP loss'
        priority: WARNING
    - uuid: e3258de641ed46d2883f0bdf6e57084c
      name: ICMP round-trip time
      type: SIMPLE
      key: icmppingsec
      delay: 1m
      value_type: FLOAT
      units: s
      triggers:
      - uuid: 2478e0cd994c400f8cae0c619ac8b273
        expression: avg(/MikroTik netPower 16P by SNMP RouterOS/icmppingsec,5m)>{$MTK.ICMP.RTT.WARN}
        name: 'MikroTik {model}: High ICMP RTT'
        priority: WARNING
    - uuid: 4b052fefa2ea4697892fac5a766d87c6
      name: SNMP agent uptime
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.2.1.1.3.0]
      key: mtk.sys.uptime
      delay: 1m
      units: uptime
      description: sysUpTime is SNMP agent uptime (seconds); may reset independently of hardware.
      preprocessing:
      - type: MULTIPLIER
        parameters:
        - '0.01'
      tags:
      - tag: component
        value: system
      triggers:
      - uuid: ae29addeabc64b57b1898b55d60efc27
        expression: nodata(/MikroTik netPower 16P by SNMP RouterOS/mtk.sys.uptime,{$MTK.SNMP.NODATA})=1 and last(/MikroTik
          netPower 16P by SNMP RouterOS/icmpping)=1
        name: 'MikroTik netPower 16P: SNMP unavailable while ICMP succeeds'
        priority: AVERAGE
    - uuid: 2d3e825e1f0a4333aee3775345654ed7
      name: System description
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.2.1.1.1.0]
      key: mtk.sys.descr
      delay: 1h
      value_type: CHAR
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 12h
      tags:
      - tag: component
        value: inventory
    - uuid: fc080dbca6a04b6fa1c6bdd8e079e8b9
      name: System object ID
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.2.1.1.2.0]
      key: mtk.sys.objectid
      delay: 1h
      value_type: CHAR
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 12h
      tags:
      - tag: component
        value: inventory
    - uuid: a2efb0621d4e452784c5b722f12762dc
      name: System name
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.2.1.1.5.0]
      key: mtk.sys.name
      delay: 1h
      value_type: CHAR
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 12h
      tags:
      - tag: component
        value: inventory
    - uuid: f0e264f3cd524cc495b68373ee708418
      name: System location
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.2.1.1.6.0]
      key: mtk.sys.location
      delay: 1h
      value_type: CHAR
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 12h
      tags:
      - tag: component
        value: inventory
    - uuid: 44eb81584bb84d73be5515ffc4952b1b
      name: System contact
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.2.1.1.4.0]
      key: mtk.sys.contact
      delay: 1h
      value_type: CHAR
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 12h
      tags:
      - tag: component
        value: inventory
    discovery_rules:
    - uuid: 61a55515ffe940aca18fef5e04da4990
      name: IF-MIB network interface discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#IFNAME},1.3.6.1.2.1.2.2.1.2]
      key: mtk.if.discovery
      delay: 1h
      filter:
        conditions:
        - macro: '{#IFNAME}'
          value: '{$MTK.IF.MATCHES}'
      item_prototypes:
      - uuid: 0e9f7f7827e94b079be67fef22f4a44a
        name: 'Interface {#IFNAME}: Operational status'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.2.2.1.8.{#SNMPINDEX}]
        key: mtk.if.oper[{#SNMPINDEX}]
        delay: 2m
        valuemap:
          name: IF-MIB ifOperStatus
        tags:
        - tag: component
          value: interface
      - uuid: 7a56af5f2a234019b77bb35b6ec1cd95
        name: 'Interface {#IFNAME}: Administrative status'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.2.2.1.7.{#SNMPINDEX}]
        key: mtk.if.admin[{#SNMPINDEX}]
        delay: 5m
        valuemap:
          name: IF-MIB ifAdminStatus
        tags:
        - tag: component
          value: interface
      - uuid: 1cca0485fc0e44afbd3ab3b3ac4677b3
        name: 'Interface {#IFNAME}: IN traffic, 64-bit'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.31.1.1.1.6.{#SNMPINDEX}]
        key: mtk.if.hc.in[{#SNMPINDEX}]
        delay: 1m
        units: bps
        description: Uses IF-MIB 64-bit counters. Older RouterOS may lack these counters.
        preprocessing:
        - type: CHANGE_PER_SECOND
        - type: MULTIPLIER
          parameters:
          - '8'
        tags:
        - tag: component
          value: interface
      - uuid: 00e5f43353874ae1ae2271022e36c780
        name: 'Interface {#IFNAME}: OUT traffic, 64-bit'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.31.1.1.1.10.{#SNMPINDEX}]
        key: mtk.if.hc.out[{#SNMPINDEX}]
        delay: 1m
        units: bps
        description: Uses IF-MIB 64-bit counters. Older RouterOS may lack these counters.
        preprocessing:
        - type: CHANGE_PER_SECOND
        - type: MULTIPLIER
          parameters:
          - '8'
        tags:
        - tag: component
          value: interface
      - uuid: 1bf83c9f4ec44c8d83a601383c15b347
        name: 'Interface {#IFNAME}: IN traffic, 32-bit'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.2.2.1.10.{#SNMPINDEX}]
        key: mtk.if.legacy.in[{#SNMPINDEX}]
        delay: 1m
        units: bps
        description: 32-bit counter fallback; may wrap at high line rates.
        preprocessing:
        - type: CHANGE_PER_SECOND
        - type: MULTIPLIER
          parameters:
          - '8'
        tags:
        - tag: component
          value: interface
      - uuid: e43fed1cd6244e668e3f754fbd2cf615
        name: 'Interface {#IFNAME}: OUT traffic, 32-bit'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.2.2.1.16.{#SNMPINDEX}]
        key: mtk.if.legacy.out[{#SNMPINDEX}]
        delay: 1m
        units: bps
        description: 32-bit counter fallback; may wrap at high line rates.
        preprocessing:
        - type: CHANGE_PER_SECOND
        - type: MULTIPLIER
          parameters:
          - '8'
        tags:
        - tag: component
          value: interface
      - uuid: 4812c320849e4f56b83238c22f0d2d35
        name: 'Interface {#IFNAME}: Inbound errors'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.2.2.1.14.{#SNMPINDEX}]
        key: mtk.if.in.errors[{#SNMPINDEX}]
        delay: 2m
        units: pps
        preprocessing:
        - type: CHANGE_PER_SECOND
        tags:
        - tag: component
          value: interface
      - uuid: 02fe388e80cc4eaab80da6cdc2a18b22
        name: 'Interface {#IFNAME}: Outbound errors'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.2.2.1.20.{#SNMPINDEX}]
        key: mtk.if.out.errors[{#SNMPINDEX}]
        delay: 2m
        units: pps
        preprocessing:
        - type: CHANGE_PER_SECOND
        tags:
        - tag: component
          value: interface
      - uuid: 6e30b3018645405f82737cde1cad94c2
        name: 'Interface {#IFNAME}: Inbound discards'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.2.2.1.13.{#SNMPINDEX}]
        key: mtk.if.in.discards[{#SNMPINDEX}]
        delay: 2m
        units: pps
        preprocessing:
        - type: CHANGE_PER_SECOND
        tags:
        - tag: component
          value: interface
      - uuid: b2d1f3f07c1e4ccb8b1e42e14a86e262
        name: 'Interface {#IFNAME}: Outbound discards'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.2.2.1.19.{#SNMPINDEX}]
        key: mtk.if.out.discards[{#SNMPINDEX}]
        delay: 2m
        units: pps
        preprocessing:
        - type: CHANGE_PER_SECOND
        tags:
        - tag: component
          value: interface
      graph_prototypes:
      - uuid: c25db3d97b404d2fbbb278459e3de7f1
        name: 'Interface {#IFNAME}: Traffic (64-bit)'
        graph_items:
        - color: 1A7AD0
          item:
            host: MikroTik netPower 16P by SNMP RouterOS
            key: mtk.if.hc.in[{#SNMPINDEX}]
        - sortorder: '1'
          color: ED682B
          item:
            host: MikroTik netPower 16P by SNMP RouterOS
            key: mtk.if.hc.out[{#SNMPINDEX}]
      - uuid: 5127c8ce8a2a4aed9d037d28ee2c7325
        name: 'Interface {#IFNAME}: Errors & Discards'
        graph_items:
        - color: CC0000
          item:
            host: MikroTik netPower 16P by SNMP RouterOS
            key: mtk.if.in.errors[{#SNMPINDEX}]
        - sortorder: '1'
          color: D4A00C
          item:
            host: MikroTik netPower 16P by SNMP RouterOS
            key: mtk.if.out.errors[{#SNMPINDEX}]
        - sortorder: '2'
          color: 5B8D2F
          item:
            host: MikroTik netPower 16P by SNMP RouterOS
            key: mtk.if.in.discards[{#SNMPINDEX}]
        - sortorder: '3'
          color: 7656A5
          item:
            host: MikroTik netPower 16P by SNMP RouterOS
            key: mtk.if.out.discards[{#SNMPINDEX}]
      trigger_prototypes:
      - uuid: 04d14e6d13414210a352324e8b024504
        expression: last(/MikroTik netPower 16P by SNMP RouterOS/mtk.if.oper[{#SNMPINDEX}])=2 and last(/MikroTik netPower
          16P by SNMP RouterOS/mtk.if.admin[{#SNMPINDEX}])=1
        name: 'MikroTik {#IFNAME}: Admin enabled, interface down'
        priority: WARNING
        description: All discovered interfaces are included by default; adjust {$MTK.IF.MATCHES} to suppress intentionally
          disconnected ports.
    - uuid: f8058b9301a3400aa189c72c8883f982
      name: CPU processor discovery (HOST-RESOURCES-MIB)
      type: SNMP_AGENT
      snmp_oid: discovery[{#CPULOAD},1.3.6.1.2.1.25.3.3.1.2]
      key: mtk.cpu.discovery
      delay: 1h
      description: Discovers CPU processor rows exposed by HOST-RESOURCES-MIB; may be unsupported by some RouterOS builds.
      item_prototypes:
      - uuid: f393e1c95df84e879c2f9cedfb419691
        name: 'CPU {#SNMPINDEX}: Utilization'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.25.3.3.1.2.{#SNMPINDEX}]
        key: mtk.cpu.load[{#SNMPINDEX}]
        delay: 2m
        units: '%'
        tags:
        - tag: component
          value: cpu
      graph_prototypes:
      - uuid: 9fb48a793d244b8ca4dd29386ead5edc
        name: 'CPU {#SNMPINDEX}: Load'
        graph_items:
        - color: 1A7AD0
          item:
            host: MikroTik netPower 16P by SNMP RouterOS
            key: mtk.cpu.load[{#SNMPINDEX}]
      trigger_prototypes:
      - uuid: 0fad84cd6e2147f9a599fae70944c84a
        expression: min(/MikroTik netPower 16P by SNMP RouterOS/mtk.cpu.load[{#SNMPINDEX}],10m)>90
        name: 'MikroTik CPU {#SNMPINDEX}: Sustained load over 90%'
        priority: WARNING
    macros:
    - macro: '{$MTK.IF.MATCHES}'
      value: .*
      description: Regex for interface descriptions discovered via IF-MIB
    - macro: '{$MTK.ICMP.LOSS.WARN}'
      value: '20'
      description: ICMP packet loss warning, percent
    - macro: '{$MTK.ICMP.RTT.WARN}'
      value: '0.15'
      description: Average ICMP RTT warning, seconds
    - macro: '{$MTK.SNMP.NODATA}'
      value: 15m
      description: SNMP poll no-data alert interval
    tags:
    - tag: class
      value: switch
    - tag: manufacturer
      value: MikroTik
    valuemaps:
    - uuid: 4bbf61b677eb468d926daa1783f00b24
      name: IF-MIB ifOperStatus
      mappings:
      - value: '1'
        newvalue: up
      - value: '2'
        newvalue: down
      - value: '3'
        newvalue: testing
      - value: '4'
        newvalue: unknown
      - value: '5'
        newvalue: dormant
      - value: '6'
        newvalue: notPresent
      - value: '7'
        newvalue: lowerLayerDown
    - uuid: 4adf520d548c46d881fb99266700c69a
      name: IF-MIB ifAdminStatus
      mappings:
      - value: '1'
        newvalue: up
      - value: '2'
        newvalue: down
      - value: '3'
        newvalue: testing
  graphs:
  - uuid: 776de1dc6d5144c9ba7bfb672d8d1f65
    name: MikroTik ICMP response and loss (netPower 16P)
    graph_items:
    - color: 1A7AD0
      item:
        host: MikroTik netPower 16P by SNMP RouterOS
        key: icmppingsec
    - sortorder: '1'
      color: C98921
      yaxisside: RIGHT
      item:
        host: MikroTik netPower 16P by SNMP RouterOS
        key: icmppingloss
