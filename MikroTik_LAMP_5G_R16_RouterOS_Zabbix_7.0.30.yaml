zabbix_export:
  version: '7.0'
  template_groups:
  - uuid: 36bff6c29af64692839d077febfc7079
    name: Templates/Network devices
  templates:
  - uuid: 96114b8babe34ce1b02ae6bb9cd5acc4
    template: MikroTik LAMP 5G R16 by SNMP
    name: MikroTik LAMP 5G R16 by SNMP
    description: 'Model profile: MikroTik LAMP 5G R16. Software family: RouterOS. Zabbix 7.0.30 standalone SNMP monitoring
      template. Generic MIBs only: SNMPv2-MIB, IF-MIB, HOST-RESOURCES-MIB. NOT hardware validated: radio signal, LTE
      signal, model-specific temperatures, PoE power, optical light metrics are omitted to prevent unsupported OID polling.
      Choose only the matching OS template for each host. Catalog: https://mikrotik.com/products/group/lte-5g-products.
      SNMP agent must be configured and reachable.'
    groups:
    - name: Templates/Network devices
    items:
    - uuid: 375ac902eb884a0f96cc46a94a94a3eb
      name: ICMP ping
      type: SIMPLE
      key: icmpping
      delay: 1m
      history: 7d
      tags:
      - tag: component
        value: availability
      triggers:
      - uuid: fa96f2d436314d549edad74564b8fa86
        expression: max(/MikroTik LAMP 5G R16 by SNMP/icmpping,#3)=0
        name: 'MikroTik {model}: ICMP unavailable'
        priority: HIGH
        description: 3 consecutive checks failed.
    - uuid: e23768be4ba3437582d38f8fbadbf77b
      name: ICMP packet loss
      type: SIMPLE
      key: icmppingloss
      delay: 1m
      value_type: FLOAT
      units: '%'
      triggers:
      - uuid: 273264eb554e45499af912b5bd3c7e79
        expression: min(/MikroTik LAMP 5G R16 by SNMP/icmppingloss,5m)>{$MTK.ICMP.LOSS.WARN} and min(/MikroTik LAMP 5G
          R16 by SNMP/icmppingloss,5m)<100
        name: 'MikroTik {model}: High ICMP loss'
        priority: WARNING
    - uuid: 602c3bfab8d548f98d00b3a08417b7aa
      name: ICMP round-trip time
      type: SIMPLE
      key: icmppingsec
      delay: 1m
      value_type: FLOAT
      units: s
      triggers:
      - uuid: d855202ebeb34fcd87044ed23e63ecb7
        expression: avg(/MikroTik LAMP 5G R16 by SNMP/icmppingsec,5m)>{$MTK.ICMP.RTT.WARN}
        name: 'MikroTik {model}: High ICMP RTT'
        priority: WARNING
    - uuid: cd2c96e327f9497c8fc1a5f9e8d3e620
      name: SNMP agent uptime
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.2.1.1.3.0]
      key: mtk.sys.uptime
      delay: 1m
      units: uptime
      description: sysUpTime is SNMP agent uptime (seconds); may reset independently of hardware.
      preprocessing:
      - type: MULTIPLIER
        parameters:
        - '0.01'
      tags:
      - tag: component
        value: system
      triggers:
      - uuid: 1e83629bc5ce4137b5767badede889d6
        expression: nodata(/MikroTik LAMP 5G R16 by SNMP/mtk.sys.uptime,{$MTK.SNMP.NODATA})=1 and last(/MikroTik LAMP
          5G R16 by SNMP/icmpping)=1
        name: 'MikroTik LAMP 5G R16: SNMP unavailable while ICMP succeeds'
        priority: AVERAGE
    - uuid: 912951c978384e688b98a61f8ac01ed6
      name: System description
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.2.1.1.1.0]
      key: mtk.sys.descr
      delay: 1h
      value_type: CHAR
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 12h
      tags:
      - tag: component
        value: inventory
    - uuid: 4a5fb6c63c804d35a0648555c6b0c8ac
      name: System object ID
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.2.1.1.2.0]
      key: mtk.sys.objectid
      delay: 1h
      value_type: CHAR
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 12h
      tags:
      - tag: component
        value: inventory
    - uuid: 95edca70e8a6434385cc81d306368faa
      name: System name
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.2.1.1.5.0]
      key: mtk.sys.name
      delay: 1h
      value_type: CHAR
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 12h
      tags:
      - tag: component
        value: inventory
    - uuid: aadf188b9a054256a68a68976f49f054
      name: System location
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.2.1.1.6.0]
      key: mtk.sys.location
      delay: 1h
      value_type: CHAR
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 12h
      tags:
      - tag: component
        value: inventory
    - uuid: 3ce02fdc7bc0415390b2d80907f52e4d
      name: System contact
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.2.1.1.4.0]
      key: mtk.sys.contact
      delay: 1h
      value_type: CHAR
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 12h
      tags:
      - tag: component
        value: inventory
    discovery_rules:
    - uuid: cc1b419c043c4bbab92af7e18cd6bb70
      name: IF-MIB network interface discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#IFNAME},1.3.6.1.2.1.2.2.1.2]
      key: mtk.if.discovery
      delay: 1h
      filter:
        conditions:
        - macro: '{#IFNAME}'
          value: '{$MTK.IF.MATCHES}'
      item_prototypes:
      - uuid: dda99c0caecf4b85a39cd811842b0e43
        name: 'Interface {#IFNAME}: Operational status'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.2.2.1.8.{#SNMPINDEX}]
        key: mtk.if.oper[{#SNMPINDEX}]
        delay: 2m
        valuemap:
          name: IF-MIB ifOperStatus
        tags:
        - tag: component
          value: interface
      - uuid: e2dc15d214d54df99bedc904a9f2f628
        name: 'Interface {#IFNAME}: Administrative status'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.2.2.1.7.{#SNMPINDEX}]
        key: mtk.if.admin[{#SNMPINDEX}]
        delay: 5m
        valuemap:
          name: IF-MIB ifAdminStatus
        tags:
        - tag: component
          value: interface
      - uuid: c7a97cdaf8c847a88218a9965db6aaa0
        name: 'Interface {#IFNAME}: IN traffic, 64-bit'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.31.1.1.1.6.{#SNMPINDEX}]
        key: mtk.if.hc.in[{#SNMPINDEX}]
        delay: 1m
        units: bps
        description: Uses IF-MIB 64-bit counters. Older RouterOS may lack these counters.
        preprocessing:
        - type: CHANGE_PER_SECOND
        - type: MULTIPLIER
          parameters:
          - '8'
        tags:
        - tag: component
          value: interface
      - uuid: 4f93a4b7673f43409bddae8c40100057
        name: 'Interface {#IFNAME}: OUT traffic, 64-bit'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.31.1.1.1.10.{#SNMPINDEX}]
        key: mtk.if.hc.out[{#SNMPINDEX}]
        delay: 1m
        units: bps
        description: Uses IF-MIB 64-bit counters. Older RouterOS may lack these counters.
        preprocessing:
        - type: CHANGE_PER_SECOND
        - type: MULTIPLIER
          parameters:
          - '8'
        tags:
        - tag: component
          value: interface
      - uuid: 653212bac7dc4cfa903434b0efa4de43
        name: 'Interface {#IFNAME}: IN traffic, 32-bit'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.2.2.1.10.{#SNMPINDEX}]
        key: mtk.if.legacy.in[{#SNMPINDEX}]
        delay: 1m
        units: bps
        description: 32-bit counter fallback; may wrap at high line rates.
        preprocessing:
        - type: CHANGE_PER_SECOND
        - type: MULTIPLIER
          parameters:
          - '8'
        tags:
        - tag: component
          value: interface
      - uuid: e24ce2d02e2e4e97972e7f8d9e258047
        name: 'Interface {#IFNAME}: OUT traffic, 32-bit'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.2.2.1.16.{#SNMPINDEX}]
        key: mtk.if.legacy.out[{#SNMPINDEX}]
        delay: 1m
        units: bps
        description: 32-bit counter fallback; may wrap at high line rates.
        preprocessing:
        - type: CHANGE_PER_SECOND
        - type: MULTIPLIER
          parameters:
          - '8'
        tags:
        - tag: component
          value: interface
      - uuid: 4f2cfd8dd7404592adea3b8e29cf3979
        name: 'Interface {#IFNAME}: Inbound errors'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.2.2.1.14.{#SNMPINDEX}]
        key: mtk.if.in.errors[{#SNMPINDEX}]
        delay: 2m
        units: pps
        preprocessing:
        - type: CHANGE_PER_SECOND
        tags:
        - tag: component
          value: interface
      - uuid: bfb94421f4cb44129e6b5e4fad557ed7
        name: 'Interface {#IFNAME}: Outbound errors'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.2.2.1.20.{#SNMPINDEX}]
        key: mtk.if.out.errors[{#SNMPINDEX}]
        delay: 2m
        units: pps
        preprocessing:
        - type: CHANGE_PER_SECOND
        tags:
        - tag: component
          value: interface
      - uuid: b2a50d47a66d4834b51dff485520152c
        name: 'Interface {#IFNAME}: Inbound discards'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.2.2.1.13.{#SNMPINDEX}]
        key: mtk.if.in.discards[{#SNMPINDEX}]
        delay: 2m
        units: pps
        preprocessing:
        - type: CHANGE_PER_SECOND
        tags:
        - tag: component
          value: interface
      - uuid: 2c90c2c49c554646878fa63cdca2efb4
        name: 'Interface {#IFNAME}: Outbound discards'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.2.2.1.19.{#SNMPINDEX}]
        key: mtk.if.out.discards[{#SNMPINDEX}]
        delay: 2m
        units: pps
        preprocessing:
        - type: CHANGE_PER_SECOND
        tags:
        - tag: component
          value: interface
      graph_prototypes:
      - uuid: 1c4f33dbb8a044c5bd37ff767acdbad0
        name: 'Interface {#IFNAME}: Traffic (64-bit)'
        graph_items:
        - color: 1A7AD0
          item:
            host: MikroTik LAMP 5G R16 by SNMP
            key: mtk.if.hc.in[{#SNMPINDEX}]
        - sortorder: '1'
          color: ED682B
          item:
            host: MikroTik LAMP 5G R16 by SNMP
            key: mtk.if.hc.out[{#SNMPINDEX}]
      - uuid: e62bec6bbee54ff39e37c64826f9096b
        name: 'Interface {#IFNAME}: Errors & Discards'
        graph_items:
        - color: CC0000
          item:
            host: MikroTik LAMP 5G R16 by SNMP
            key: mtk.if.in.errors[{#SNMPINDEX}]
        - sortorder: '1'
          color: D4A00C
          item:
            host: MikroTik LAMP 5G R16 by SNMP
            key: mtk.if.out.errors[{#SNMPINDEX}]
        - sortorder: '2'
          color: 5B8D2F
          item:
            host: MikroTik LAMP 5G R16 by SNMP
            key: mtk.if.in.discards[{#SNMPINDEX}]
        - sortorder: '3'
          color: 7656A5
          item:
            host: MikroTik LAMP 5G R16 by SNMP
            key: mtk.if.out.discards[{#SNMPINDEX}]
      trigger_prototypes:
      - uuid: 0e146d05fe51477883c08daa9a3114cc
        expression: last(/MikroTik LAMP 5G R16 by SNMP/mtk.if.oper[{#SNMPINDEX}])=2 and last(/MikroTik LAMP 5G R16 by
          SNMP/mtk.if.admin[{#SNMPINDEX}])=1
        name: 'MikroTik {#IFNAME}: Admin enabled, interface down'
        priority: WARNING
        description: All discovered interfaces are included by default; adjust {$MTK.IF.MATCHES} to suppress intentionally
          disconnected ports.
    - uuid: 9be94be35891468fa98dddf9cf05bcfa
      name: CPU processor discovery (HOST-RESOURCES-MIB)
      type: SNMP_AGENT
      snmp_oid: discovery[{#CPULOAD},1.3.6.1.2.1.25.3.3.1.2]
      key: mtk.cpu.discovery
      delay: 1h
      description: Discovers CPU processor rows exposed by HOST-RESOURCES-MIB; may be unsupported by some RouterOS builds.
      item_prototypes:
      - uuid: dd6d48fc513948728f3d6e1e50ac166e
        name: 'CPU {#SNMPINDEX}: Utilization'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.25.3.3.1.2.{#SNMPINDEX}]
        key: mtk.cpu.load[{#SNMPINDEX}]
        delay: 2m
        units: '%'
        tags:
        - tag: component
          value: cpu
      graph_prototypes:
      - uuid: 810fdd9c3dff4e77a43609c479efb048
        name: 'CPU {#SNMPINDEX}: Load'
        graph_items:
        - color: 1A7AD0
          item:
            host: MikroTik LAMP 5G R16 by SNMP
            key: mtk.cpu.load[{#SNMPINDEX}]
      trigger_prototypes:
      - uuid: 1bdc85c6fcf44f429b973bc8459ed115
        expression: min(/MikroTik LAMP 5G R16 by SNMP/mtk.cpu.load[{#SNMPINDEX}],10m)>90
        name: 'MikroTik CPU {#SNMPINDEX}: Sustained load over 90%'
        priority: WARNING
    macros:
    - macro: '{$MTK.IF.MATCHES}'
      value: .*
      description: Regex for interface descriptions discovered via IF-MIB
    - macro: '{$MTK.ICMP.LOSS.WARN}'
      value: '20'
      description: ICMP packet loss warning, percent
    - macro: '{$MTK.ICMP.RTT.WARN}'
      value: '0.15'
      description: Average ICMP RTT warning, seconds
    - macro: '{$MTK.SNMP.NODATA}'
      value: 15m
      description: SNMP poll no-data alert interval
    tags:
    - tag: class
      value: router/network
    - tag: manufacturer
      value: MikroTik
    valuemaps:
    - uuid: e8ec6c039b2e495fb69d8b2a92874344
      name: IF-MIB ifOperStatus
      mappings:
      - value: '1'
        newvalue: up
      - value: '2'
        newvalue: down
      - value: '3'
        newvalue: testing
      - value: '4'
        newvalue: unknown
      - value: '5'
        newvalue: dormant
      - value: '6'
        newvalue: notPresent
      - value: '7'
        newvalue: lowerLayerDown
    - uuid: 342a77c189ba4bea8ff266b108d57227
      name: IF-MIB ifAdminStatus
      mappings:
      - value: '1'
        newvalue: up
      - value: '2'
        newvalue: down
      - value: '3'
        newvalue: testing
  graphs:
  - uuid: e5f064a69dea4fd88c07c2e0085817c1
    name: MikroTik ICMP response and loss (LAMP 5G R16)
    graph_items:
    - color: 1A7AD0
      item:
        host: MikroTik LAMP 5G R16 by SNMP
        key: icmppingsec
    - sortorder: '1'
      color: C98921
      yaxisside: RIGHT
      item:
        host: MikroTik LAMP 5G R16 by SNMP
        key: icmppingloss
