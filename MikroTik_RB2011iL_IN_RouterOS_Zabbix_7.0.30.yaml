zabbix_export:
  version: '7.0'
  template_groups:
  - uuid: 36bff6c29af64692839d077febfc7079
    name: Templates/Network devices
  templates:
  - uuid: 79ce2cccf62b4551ace7cd3c0fd423b5
    template: MikroTik RB2011iL-IN by SNMP
    name: MikroTik RB2011iL-IN by SNMP
    description: 'Model profile: MikroTik RB2011iL-IN. Software family: RouterOS. Zabbix 7.0.30 standalone SNMP monitoring
      template. Generic MIBs only: SNMPv2-MIB, IF-MIB, HOST-RESOURCES-MIB. NOT hardware validated: radio signal, LTE
      signal, model-specific temperatures, PoE power, optical light metrics are omitted to prevent unsupported OID polling.
      Choose only the matching OS template for each host. Catalog: https://www.zabbix.com/documentation/7.0/en/manual/config/templates_out_of_the_box/network_devices.
      SNMP agent must be configured and reachable.'
    groups:
    - name: Templates/Network devices
    items:
    - uuid: ae6db59a72e5479aba03780d438cbdea
      name: ICMP ping
      type: SIMPLE
      key: icmpping
      delay: 1m
      history: 7d
      tags:
      - tag: component
        value: availability
      triggers:
      - uuid: 59a788577164450d86ceea5ad803f490
        expression: max(/MikroTik RB2011iL-IN by SNMP/icmpping,#3)=0
        name: 'MikroTik {model}: ICMP unavailable'
        priority: HIGH
        description: 3 consecutive checks failed.
    - uuid: d6e3ab21b7d444fabd9df82a6135d3e5
      name: ICMP packet loss
      type: SIMPLE
      key: icmppingloss
      delay: 1m
      value_type: FLOAT
      units: '%'
      triggers:
      - uuid: 2955a7b9a31b4163a2da24047fcc649c
        expression: min(/MikroTik RB2011iL-IN by SNMP/icmppingloss,5m)>{$MTK.ICMP.LOSS.WARN} and min(/MikroTik RB2011iL-IN
          by SNMP/icmppingloss,5m)<100
        name: 'MikroTik {model}: High ICMP loss'
        priority: WARNING
    - uuid: 7e58e752602948c0adae7a662f2bf0e2
      name: ICMP round-trip time
      type: SIMPLE
      key: icmppingsec
      delay: 1m
      value_type: FLOAT
      units: s
      triggers:
      - uuid: e26f82780a9148b1a7a486b4d5f59c6b
        expression: avg(/MikroTik RB2011iL-IN by SNMP/icmppingsec,5m)>{$MTK.ICMP.RTT.WARN}
        name: 'MikroTik {model}: High ICMP RTT'
        priority: WARNING
    - uuid: c266618294824352b74ee38590280be0
      name: SNMP agent uptime
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.2.1.1.3.0]
      key: mtk.sys.uptime
      delay: 1m
      units: uptime
      description: sysUpTime is SNMP agent uptime (seconds); may reset independently of hardware.
      preprocessing:
      - type: MULTIPLIER
        parameters:
        - '0.01'
      tags:
      - tag: component
        value: system
      triggers:
      - uuid: 0f485a3cfcd1466bb6e930ec6c76d8c0
        expression: nodata(/MikroTik RB2011iL-IN by SNMP/mtk.sys.uptime,{$MTK.SNMP.NODATA})=1 and last(/MikroTik RB2011iL-IN
          by SNMP/icmpping)=1
        name: 'MikroTik RB2011iL-IN: SNMP unavailable while ICMP succeeds'
        priority: AVERAGE
    - uuid: 0d95567a5d1f4cee8e482843d868bbf5
      name: System description
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.2.1.1.1.0]
      key: mtk.sys.descr
      delay: 1h
      value_type: CHAR
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 12h
      tags:
      - tag: component
        value: inventory
    - uuid: 87b206e4ecf547ad8e2c765b88bb16d3
      name: System object ID
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.2.1.1.2.0]
      key: mtk.sys.objectid
      delay: 1h
      value_type: CHAR
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 12h
      tags:
      - tag: component
        value: inventory
    - uuid: 25ee0cd24c114478b4818b231b4ce95e
      name: System name
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.2.1.1.5.0]
      key: mtk.sys.name
      delay: 1h
      value_type: CHAR
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 12h
      tags:
      - tag: component
        value: inventory
    - uuid: 207ffcb0a44d4ac59a4fc0c7898879f8
      name: System location
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.2.1.1.6.0]
      key: mtk.sys.location
      delay: 1h
      value_type: CHAR
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 12h
      tags:
      - tag: component
        value: inventory
    - uuid: 5419cf0b81314bcaa8637d843e18ccfb
      name: System contact
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.2.1.1.4.0]
      key: mtk.sys.contact
      delay: 1h
      value_type: CHAR
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 12h
      tags:
      - tag: component
        value: inventory
    discovery_rules:
    - uuid: 7fc509487dc74e80a4bcdbeef5aa2bae
      name: IF-MIB network interface discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#IFNAME},1.3.6.1.2.1.2.2.1.2]
      key: mtk.if.discovery
      delay: 1h
      filter:
        conditions:
        - macro: '{#IFNAME}'
          value: '{$MTK.IF.MATCHES}'
      item_prototypes:
      - uuid: 2446d1c423894d1b8ccde085ae3ba119
        name: 'Interface {#IFNAME}: Operational status'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.2.2.1.8.{#SNMPINDEX}]
        key: mtk.if.oper[{#SNMPINDEX}]
        delay: 2m
        valuemap:
          name: IF-MIB ifOperStatus
        tags:
        - tag: component
          value: interface
      - uuid: e175f3d7376e4058adf3354f47b24d0f
        name: 'Interface {#IFNAME}: Administrative status'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.2.2.1.7.{#SNMPINDEX}]
        key: mtk.if.admin[{#SNMPINDEX}]
        delay: 5m
        valuemap:
          name: IF-MIB ifAdminStatus
        tags:
        - tag: component
          value: interface
      - uuid: 7406cce8878a4d54b12e2617fe63995d
        name: 'Interface {#IFNAME}: IN traffic, 64-bit'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.31.1.1.1.6.{#SNMPINDEX}]
        key: mtk.if.hc.in[{#SNMPINDEX}]
        delay: 1m
        units: bps
        description: Uses IF-MIB 64-bit counters. Older RouterOS may lack these counters.
        preprocessing:
        - type: CHANGE_PER_SECOND
        - type: MULTIPLIER
          parameters:
          - '8'
        tags:
        - tag: component
          value: interface
      - uuid: 7cb67de22b2c4545aa5fe80228bb7142
        name: 'Interface {#IFNAME}: OUT traffic, 64-bit'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.31.1.1.1.10.{#SNMPINDEX}]
        key: mtk.if.hc.out[{#SNMPINDEX}]
        delay: 1m
        units: bps
        description: Uses IF-MIB 64-bit counters. Older RouterOS may lack these counters.
        preprocessing:
        - type: CHANGE_PER_SECOND
        - type: MULTIPLIER
          parameters:
          - '8'
        tags:
        - tag: component
          value: interface
      - uuid: ba135282d4704402a6f6031baf7845b8
        name: 'Interface {#IFNAME}: IN traffic, 32-bit'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.2.2.1.10.{#SNMPINDEX}]
        key: mtk.if.legacy.in[{#SNMPINDEX}]
        delay: 1m
        units: bps
        description: 32-bit counter fallback; may wrap at high line rates.
        preprocessing:
        - type: CHANGE_PER_SECOND
        - type: MULTIPLIER
          parameters:
          - '8'
        tags:
        - tag: component
          value: interface
      - uuid: cb7b3b7856d648d1b30dac89e2a1fd1d
        name: 'Interface {#IFNAME}: OUT traffic, 32-bit'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.2.2.1.16.{#SNMPINDEX}]
        key: mtk.if.legacy.out[{#SNMPINDEX}]
        delay: 1m
        units: bps
        description: 32-bit counter fallback; may wrap at high line rates.
        preprocessing:
        - type: CHANGE_PER_SECOND
        - type: MULTIPLIER
          parameters:
          - '8'
        tags:
        - tag: component
          value: interface
      - uuid: 711f1f292cbf4752a1b8b34b5e7b9ffb
        name: 'Interface {#IFNAME}: Inbound errors'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.2.2.1.14.{#SNMPINDEX}]
        key: mtk.if.in.errors[{#SNMPINDEX}]
        delay: 2m
        units: pps
        preprocessing:
        - type: CHANGE_PER_SECOND
        tags:
        - tag: component
          value: interface
      - uuid: 3ff5ca619ec340e8a3778602bf0f16ec
        name: 'Interface {#IFNAME}: Outbound errors'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.2.2.1.20.{#SNMPINDEX}]
        key: mtk.if.out.errors[{#SNMPINDEX}]
        delay: 2m
        units: pps
        preprocessing:
        - type: CHANGE_PER_SECOND
        tags:
        - tag: component
          value: interface
      - uuid: 0854816f31f643ff90ab534d840a982a
        name: 'Interface {#IFNAME}: Inbound discards'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.2.2.1.13.{#SNMPINDEX}]
        key: mtk.if.in.discards[{#SNMPINDEX}]
        delay: 2m
        units: pps
        preprocessing:
        - type: CHANGE_PER_SECOND
        tags:
        - tag: component
          value: interface
      - uuid: f8f946c333c74fd882b91b71b6f53512
        name: 'Interface {#IFNAME}: Outbound discards'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.2.2.1.19.{#SNMPINDEX}]
        key: mtk.if.out.discards[{#SNMPINDEX}]
        delay: 2m
        units: pps
        preprocessing:
        - type: CHANGE_PER_SECOND
        tags:
        - tag: component
          value: interface
      graph_prototypes:
      - uuid: 7805016414884890857829a36f80f2ff
        name: 'Interface {#IFNAME}: Traffic (64-bit)'
        graph_items:
        - color: 1A7AD0
          item:
            host: MikroTik RB2011iL-IN by SNMP
            key: mtk.if.hc.in[{#SNMPINDEX}]
        - sortorder: '1'
          color: ED682B
          item:
            host: MikroTik RB2011iL-IN by SNMP
            key: mtk.if.hc.out[{#SNMPINDEX}]
      - uuid: e0b6a3c2bee24e44bb38bded3b27335e
        name: 'Interface {#IFNAME}: Errors & Discards'
        graph_items:
        - color: CC0000
          item:
            host: MikroTik RB2011iL-IN by SNMP
            key: mtk.if.in.errors[{#SNMPINDEX}]
        - sortorder: '1'
          color: D4A00C
          item:
            host: MikroTik RB2011iL-IN by SNMP
            key: mtk.if.out.errors[{#SNMPINDEX}]
        - sortorder: '2'
          color: 5B8D2F
          item:
            host: MikroTik RB2011iL-IN by SNMP
            key: mtk.if.in.discards[{#SNMPINDEX}]
        - sortorder: '3'
          color: 7656A5
          item:
            host: MikroTik RB2011iL-IN by SNMP
            key: mtk.if.out.discards[{#SNMPINDEX}]
      trigger_prototypes:
      - uuid: 1f7a767eda1e403388b09a9c92036d67
        expression: last(/MikroTik RB2011iL-IN by SNMP/mtk.if.oper[{#SNMPINDEX}])=2 and last(/MikroTik RB2011iL-IN by
          SNMP/mtk.if.admin[{#SNMPINDEX}])=1
        name: 'MikroTik {#IFNAME}: Admin enabled, interface down'
        priority: WARNING
        description: All discovered interfaces are included by default; adjust {$MTK.IF.MATCHES} to suppress intentionally
          disconnected ports.
    - uuid: 908ca4f5caba4dc48543992b06a9ede8
      name: CPU processor discovery (HOST-RESOURCES-MIB)
      type: SNMP_AGENT
      snmp_oid: discovery[{#CPULOAD},1.3.6.1.2.1.25.3.3.1.2]
      key: mtk.cpu.discovery
      delay: 1h
      description: Discovers CPU processor rows exposed by HOST-RESOURCES-MIB; may be unsupported by some RouterOS builds.
      item_prototypes:
      - uuid: 28fc581566c64cbf8ad141b95a868bd4
        name: 'CPU {#SNMPINDEX}: Utilization'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.25.3.3.1.2.{#SNMPINDEX}]
        key: mtk.cpu.load[{#SNMPINDEX}]
        delay: 2m
        units: '%'
        tags:
        - tag: component
          value: cpu
      graph_prototypes:
      - uuid: 3509eb7fab974eba9fed8c918a41af9e
        name: 'CPU {#SNMPINDEX}: Load'
        graph_items:
        - color: 1A7AD0
          item:
            host: MikroTik RB2011iL-IN by SNMP
            key: mtk.cpu.load[{#SNMPINDEX}]
      trigger_prototypes:
      - uuid: 2d09622b82854e67829c672c138f84af
        expression: min(/MikroTik RB2011iL-IN by SNMP/mtk.cpu.load[{#SNMPINDEX}],10m)>90
        name: 'MikroTik CPU {#SNMPINDEX}: Sustained load over 90%'
        priority: WARNING
    macros:
    - macro: '{$MTK.IF.MATCHES}'
      value: .*
      description: Regex for interface descriptions discovered via IF-MIB
    - macro: '{$MTK.ICMP.LOSS.WARN}'
      value: '20'
      description: ICMP packet loss warning, percent
    - macro: '{$MTK.ICMP.RTT.WARN}'
      value: '0.15'
      description: Average ICMP RTT warning, seconds
    - macro: '{$MTK.SNMP.NODATA}'
      value: 15m
      description: SNMP poll no-data alert interval
    tags:
    - tag: class
      value: router/network
    - tag: manufacturer
      value: MikroTik
    valuemaps:
    - uuid: d18f7bc922f245ea852817a553deb820
      name: IF-MIB ifOperStatus
      mappings:
      - value: '1'
        newvalue: up
      - value: '2'
        newvalue: down
      - value: '3'
        newvalue: testing
      - value: '4'
        newvalue: unknown
      - value: '5'
        newvalue: dormant
      - value: '6'
        newvalue: notPresent
      - value: '7'
        newvalue: lowerLayerDown
    - uuid: 47f5ad9334e34e68853efcc75c4e0f90
      name: IF-MIB ifAdminStatus
      mappings:
      - value: '1'
        newvalue: up
      - value: '2'
        newvalue: down
      - value: '3'
        newvalue: testing
  graphs:
  - uuid: d3938369c8614ba9b3a8ec49c11b6786
    name: MikroTik ICMP response and loss (RB2011iL-IN)
    graph_items:
    - color: 1A7AD0
      item:
        host: MikroTik RB2011iL-IN by SNMP
        key: icmppingsec
    - sortorder: '1'
      color: C98921
      yaxisside: RIGHT
      item:
        host: MikroTik RB2011iL-IN by SNMP
        key: icmppingloss
