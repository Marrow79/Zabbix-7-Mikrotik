zabbix_export:
  version: '7.0'
  template_groups:
  - uuid: 36bff6c29af64692839d077febfc7079
    name: Templates/Network devices
  templates:
  - uuid: c9f57a19cca44c5191194bbe9dc5de3e
    template: MikroTik OmniTIK 5 PoE ac by SNMP
    name: MikroTik OmniTIK 5 PoE ac by SNMP
    description: 'Model profile: MikroTik OmniTIK 5 PoE ac. Software family: RouterOS. Zabbix 7.0.30 standalone SNMP
      monitoring template. Generic MIBs only: SNMPv2-MIB, IF-MIB, HOST-RESOURCES-MIB. NOT hardware validated: radio signal,
      LTE signal, model-specific temperatures, PoE power, optical light metrics are omitted to prevent unsupported OID
      polling. Choose only the matching OS template for each host. Catalog: https://mikrotik.com/products/group/wireless-systems.
      SNMP agent must be configured and reachable.'
    groups:
    - name: Templates/Network devices
    items:
    - uuid: 95f63ee5e2ed461ba5c65da9f3b96e21
      name: ICMP ping
      type: SIMPLE
      key: icmpping
      delay: 1m
      history: 7d
      tags:
      - tag: component
        value: availability
      triggers:
      - uuid: 8f3f7748d3014d66b195807a5613f379
        expression: max(/MikroTik OmniTIK 5 PoE ac by SNMP/icmpping,#3)=0
        name: 'MikroTik {model}: ICMP unavailable'
        priority: HIGH
        description: 3 consecutive checks failed.
    - uuid: 225986e137c3481d8d8fd5c3f11496d9
      name: ICMP packet loss
      type: SIMPLE
      key: icmppingloss
      delay: 1m
      value_type: FLOAT
      units: '%'
      triggers:
      - uuid: 59e433d4501841e190a3b72aa345b746
        expression: min(/MikroTik OmniTIK 5 PoE ac by SNMP/icmppingloss,5m)>{$MTK.ICMP.LOSS.WARN} and min(/MikroTik OmniTIK
          5 PoE ac by SNMP/icmppingloss,5m)<100
        name: 'MikroTik {model}: High ICMP loss'
        priority: WARNING
    - uuid: 677c19ef06894267993df69bfe310c8c
      name: ICMP round-trip time
      type: SIMPLE
      key: icmppingsec
      delay: 1m
      value_type: FLOAT
      units: s
      triggers:
      - uuid: d8cd3a1c2aaf4d34aa02b66daf02ddd5
        expression: avg(/MikroTik OmniTIK 5 PoE ac by SNMP/icmppingsec,5m)>{$MTK.ICMP.RTT.WARN}
        name: 'MikroTik {model}: High ICMP RTT'
        priority: WARNING
    - uuid: bb422c55e929405883c659f7f90c31cb
      name: SNMP agent uptime
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.2.1.1.3.0]
      key: mtk.sys.uptime
      delay: 1m
      units: uptime
      description: sysUpTime is SNMP agent uptime (seconds); may reset independently of hardware.
      preprocessing:
      - type: MULTIPLIER
        parameters:
        - '0.01'
      tags:
      - tag: component
        value: system
      triggers:
      - uuid: addabc1f31cb4aaa928a8797817a5c39
        expression: nodata(/MikroTik OmniTIK 5 PoE ac by SNMP/mtk.sys.uptime,{$MTK.SNMP.NODATA})=1 and last(/MikroTik
          OmniTIK 5 PoE ac by SNMP/icmpping)=1
        name: 'MikroTik OmniTIK 5 PoE ac: SNMP unavailable while ICMP succeeds'
        priority: AVERAGE
    - uuid: ba6f971883bc4d099b2fa9ffb3ac44b5
      name: System description
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.2.1.1.1.0]
      key: mtk.sys.descr
      delay: 1h
      value_type: CHAR
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 12h
      tags:
      - tag: component
        value: inventory
    - uuid: 3c63eab9d37d45ee8b2cb687a8faafa8
      name: System object ID
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.2.1.1.2.0]
      key: mtk.sys.objectid
      delay: 1h
      value_type: CHAR
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 12h
      tags:
      - tag: component
        value: inventory
    - uuid: 1b7f00750cf747faa0b14b99a23422cd
      name: System name
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.2.1.1.5.0]
      key: mtk.sys.name
      delay: 1h
      value_type: CHAR
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 12h
      tags:
      - tag: component
        value: inventory
    - uuid: c35acf4cfdc549d8bf9b34c2d4ac36aa
      name: System location
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.2.1.1.6.0]
      key: mtk.sys.location
      delay: 1h
      value_type: CHAR
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 12h
      tags:
      - tag: component
        value: inventory
    - uuid: 9b0301b6eb0d478eaa9ffc446f3cf818
      name: System contact
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.2.1.1.4.0]
      key: mtk.sys.contact
      delay: 1h
      value_type: CHAR
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 12h
      tags:
      - tag: component
        value: inventory
    discovery_rules:
    - uuid: 552a00ed7de84f648b0cbf9fe7279810
      name: IF-MIB network interface discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#IFNAME},1.3.6.1.2.1.2.2.1.2]
      key: mtk.if.discovery
      delay: 1h
      filter:
        conditions:
        - macro: '{#IFNAME}'
          value: '{$MTK.IF.MATCHES}'
      item_prototypes:
      - uuid: a06f7f80f075450fbc3860a4cb43c8ea
        name: 'Interface {#IFNAME}: Operational status'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.2.2.1.8.{#SNMPINDEX}]
        key: mtk.if.oper[{#SNMPINDEX}]
        delay: 2m
        valuemap:
          name: IF-MIB ifOperStatus
        tags:
        - tag: component
          value: interface
      - uuid: 845b64100da6411489e2cfedf6ac778f
        name: 'Interface {#IFNAME}: Administrative status'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.2.2.1.7.{#SNMPINDEX}]
        key: mtk.if.admin[{#SNMPINDEX}]
        delay: 5m
        valuemap:
          name: IF-MIB ifAdminStatus
        tags:
        - tag: component
          value: interface
      - uuid: 0c9ef6be6a064f19a9d9d64fce68e3b5
        name: 'Interface {#IFNAME}: IN traffic, 64-bit'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.31.1.1.1.6.{#SNMPINDEX}]
        key: mtk.if.hc.in[{#SNMPINDEX}]
        delay: 1m
        units: bps
        description: Uses IF-MIB 64-bit counters. Older RouterOS may lack these counters.
        preprocessing:
        - type: CHANGE_PER_SECOND
        - type: MULTIPLIER
          parameters:
          - '8'
        tags:
        - tag: component
          value: interface
      - uuid: 3f0d5e779c92461da7433d18c322508b
        name: 'Interface {#IFNAME}: OUT traffic, 64-bit'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.31.1.1.1.10.{#SNMPINDEX}]
        key: mtk.if.hc.out[{#SNMPINDEX}]
        delay: 1m
        units: bps
        description: Uses IF-MIB 64-bit counters. Older RouterOS may lack these counters.
        preprocessing:
        - type: CHANGE_PER_SECOND
        - type: MULTIPLIER
          parameters:
          - '8'
        tags:
        - tag: component
          value: interface
      - uuid: 5555f606682f473fb7523b8693fe4e2f
        name: 'Interface {#IFNAME}: IN traffic, 32-bit'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.2.2.1.10.{#SNMPINDEX}]
        key: mtk.if.legacy.in[{#SNMPINDEX}]
        delay: 1m
        units: bps
        description: 32-bit counter fallback; may wrap at high line rates.
        preprocessing:
        - type: CHANGE_PER_SECOND
        - type: MULTIPLIER
          parameters:
          - '8'
        tags:
        - tag: component
          value: interface
      - uuid: d647eb6482e74472bbb33d5ac974d08a
        name: 'Interface {#IFNAME}: OUT traffic, 32-bit'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.2.2.1.16.{#SNMPINDEX}]
        key: mtk.if.legacy.out[{#SNMPINDEX}]
        delay: 1m
        units: bps
        description: 32-bit counter fallback; may wrap at high line rates.
        preprocessing:
        - type: CHANGE_PER_SECOND
        - type: MULTIPLIER
          parameters:
          - '8'
        tags:
        - tag: component
          value: interface
      - uuid: ccdff6722dea4943a748252cef317099
        name: 'Interface {#IFNAME}: Inbound errors'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.2.2.1.14.{#SNMPINDEX}]
        key: mtk.if.in.errors[{#SNMPINDEX}]
        delay: 2m
        units: pps
        preprocessing:
        - type: CHANGE_PER_SECOND
        tags:
        - tag: component
          value: interface
      - uuid: ee326326f1714fe3b92a70310c446916
        name: 'Interface {#IFNAME}: Outbound errors'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.2.2.1.20.{#SNMPINDEX}]
        key: mtk.if.out.errors[{#SNMPINDEX}]
        delay: 2m
        units: pps
        preprocessing:
        - type: CHANGE_PER_SECOND
        tags:
        - tag: component
          value: interface
      - uuid: 03fba36c803e481282a609f25ac9a462
        name: 'Interface {#IFNAME}: Inbound discards'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.2.2.1.13.{#SNMPINDEX}]
        key: mtk.if.in.discards[{#SNMPINDEX}]
        delay: 2m
        units: pps
        preprocessing:
        - type: CHANGE_PER_SECOND
        tags:
        - tag: component
          value: interface
      - uuid: a1c4cdadbff14168b5e95352f2000062
        name: 'Interface {#IFNAME}: Outbound discards'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.2.2.1.19.{#SNMPINDEX}]
        key: mtk.if.out.discards[{#SNMPINDEX}]
        delay: 2m
        units: pps
        preprocessing:
        - type: CHANGE_PER_SECOND
        tags:
        - tag: component
          value: interface
      graph_prototypes:
      - uuid: 1eb3dc12b80649edb03dc27cacb4a62a
        name: 'Interface {#IFNAME}: Traffic (64-bit)'
        graph_items:
        - color: 1A7AD0
          item:
            host: MikroTik OmniTIK 5 PoE ac by SNMP
            key: mtk.if.hc.in[{#SNMPINDEX}]
        - sortorder: '1'
          color: ED682B
          item:
            host: MikroTik OmniTIK 5 PoE ac by SNMP
            key: mtk.if.hc.out[{#SNMPINDEX}]
      - uuid: 73756fa873c540b2ab848aa4993f7156
        name: 'Interface {#IFNAME}: Errors & Discards'
        graph_items:
        - color: CC0000
          item:
            host: MikroTik OmniTIK 5 PoE ac by SNMP
            key: mtk.if.in.errors[{#SNMPINDEX}]
        - sortorder: '1'
          color: D4A00C
          item:
            host: MikroTik OmniTIK 5 PoE ac by SNMP
            key: mtk.if.out.errors[{#SNMPINDEX}]
        - sortorder: '2'
          color: 5B8D2F
          item:
            host: MikroTik OmniTIK 5 PoE ac by SNMP
            key: mtk.if.in.discards[{#SNMPINDEX}]
        - sortorder: '3'
          color: 7656A5
          item:
            host: MikroTik OmniTIK 5 PoE ac by SNMP
            key: mtk.if.out.discards[{#SNMPINDEX}]
      trigger_prototypes:
      - uuid: dd5a831110ed4948a0f9e3c5e2afd47e
        expression: last(/MikroTik OmniTIK 5 PoE ac by SNMP/mtk.if.oper[{#SNMPINDEX}])=2 and last(/MikroTik OmniTIK 5
          PoE ac by SNMP/mtk.if.admin[{#SNMPINDEX}])=1
        name: 'MikroTik {#IFNAME}: Admin enabled, interface down'
        priority: WARNING
        description: All discovered interfaces are included by default; adjust {$MTK.IF.MATCHES} to suppress intentionally
          disconnected ports.
    - uuid: 8a056e4c36f14fadac8dcad517e34cc9
      name: CPU processor discovery (HOST-RESOURCES-MIB)
      type: SNMP_AGENT
      snmp_oid: discovery[{#CPULOAD},1.3.6.1.2.1.25.3.3.1.2]
      key: mtk.cpu.discovery
      delay: 1h
      description: Discovers CPU processor rows exposed by HOST-RESOURCES-MIB; may be unsupported by some RouterOS builds.
      item_prototypes:
      - uuid: 35964a11094b49aa918116053fbb8c64
        name: 'CPU {#SNMPINDEX}: Utilization'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.25.3.3.1.2.{#SNMPINDEX}]
        key: mtk.cpu.load[{#SNMPINDEX}]
        delay: 2m
        units: '%'
        tags:
        - tag: component
          value: cpu
      graph_prototypes:
      - uuid: 52ca614cee2d499b88db3ef110228037
        name: 'CPU {#SNMPINDEX}: Load'
        graph_items:
        - color: 1A7AD0
          item:
            host: MikroTik OmniTIK 5 PoE ac by SNMP
            key: mtk.cpu.load[{#SNMPINDEX}]
      trigger_prototypes:
      - uuid: 8024ce09ebb44e43a7c7c9393ff5befd
        expression: min(/MikroTik OmniTIK 5 PoE ac by SNMP/mtk.cpu.load[{#SNMPINDEX}],10m)>90
        name: 'MikroTik CPU {#SNMPINDEX}: Sustained load over 90%'
        priority: WARNING
    macros:
    - macro: '{$MTK.IF.MATCHES}'
      value: .*
      description: Regex for interface descriptions discovered via IF-MIB
    - macro: '{$MTK.ICMP.LOSS.WARN}'
      value: '20'
      description: ICMP packet loss warning, percent
    - macro: '{$MTK.ICMP.RTT.WARN}'
      value: '0.15'
      description: Average ICMP RTT warning, seconds
    - macro: '{$MTK.SNMP.NODATA}'
      value: 15m
      description: SNMP poll no-data alert interval
    tags:
    - tag: class
      value: router/network
    - tag: manufacturer
      value: MikroTik
    valuemaps:
    - uuid: 2098f33eca214caab22dacba633d6be2
      name: IF-MIB ifOperStatus
      mappings:
      - value: '1'
        newvalue: up
      - value: '2'
        newvalue: down
      - value: '3'
        newvalue: testing
      - value: '4'
        newvalue: unknown
      - value: '5'
        newvalue: dormant
      - value: '6'
        newvalue: notPresent
      - value: '7'
        newvalue: lowerLayerDown
    - uuid: b9a7caaa4baf429eb2d527eb78309209
      name: IF-MIB ifAdminStatus
      mappings:
      - value: '1'
        newvalue: up
      - value: '2'
        newvalue: down
      - value: '3'
        newvalue: testing
  graphs:
  - uuid: 83b57d9722ee44e98f9097bea04d2189
    name: MikroTik ICMP response and loss (OmniTIK 5 PoE ac)
    graph_items:
    - color: 1A7AD0
      item:
        host: MikroTik OmniTIK 5 PoE ac by SNMP
        key: icmppingsec
    - sortorder: '1'
      color: C98921
      yaxisside: RIGHT
      item:
        host: MikroTik OmniTIK 5 PoE ac by SNMP
        key: icmppingloss
